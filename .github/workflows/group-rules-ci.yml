name: Firestore rules emulator checks
on:
  push:
    branches: [fix/group-permissions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and emulator tools (CI only)
        run: |
          npm install
          npm install --no-save --legacy-peer-deps firebase-tools @firebase/rules-unit-testing
      - name: Exercise group membership permissions against Firestore emulator
        run: npx firebase emulators:exec --only firestore --project plot-twist-rules-test 'node --test tests/firestore.rules.test.mjs'
