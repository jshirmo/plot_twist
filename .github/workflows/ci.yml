name: Plot Twist CI

on:
  push:
    branches:
      - feature/jasmine
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
